# /etc/nginx/sites-available/crm-analytics  (ln -s в sites-enabled, затем: certbot --nginx -d crm.example.com)
upstream crm_analytics {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name crm.example.com;
    # certbot --nginx заменит этот блок на редирект 301 и допишет server с listen 443 ssl
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://crm_analytics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ручной синк с wait=true может идти дольше минуты при полном перечитывании
    location = /api/sync/run {
        proxy_pass http://crm_analytics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
